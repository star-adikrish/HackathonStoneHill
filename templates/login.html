<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Family Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        .bg-wrapper {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(
                135deg,
                #e8f4f8 0%,
                #fdf2f8 30%,
                #fef9e7 60%,
                #f0f9ff 100%
            );
        }

        .bg-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 70% 60% at 10% 20%, rgba(255, 182, 193, 0.6), transparent 50%),
                radial-gradient(ellipse 60% 50% at 90% 80%, rgba(173, 216, 230, 0.6), transparent 50%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(221, 160, 221, 0.3), transparent 60%);
            animation: bgFlow 12s ease-in-out infinite alternate;
        }

        @keyframes bgFlow {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.9; transform: scale(1.02); }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.6;
            animation: floatOrb 18s ease-in-out infinite;
            will-change: transform;
        }
        .orb-1 { width: 320px; height: 320px; background: rgba(255, 182, 193, 0.7); top: 5%; left: 5%; animation-delay: 0s; }
        .orb-2 { width: 280px; height: 280px; background: rgba(173, 216, 230, 0.7); top: 55%; right: 10%; animation-delay: -4s; }
        .orb-3 { width: 220px; height: 220px; background: rgba(221, 160, 221, 0.5); bottom: 15%; left: 15%; animation-delay: -8s; }
        .orb-4 { width: 200px; height: 200px; background: rgba(255, 218, 185, 0.6); top: 25%; right: 25%; animation-delay: -2s; }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(25px, -35px) scale(1.08); }
            66% { transform: translate(-15px, 25px) scale(0.96); }
        }

        .shape {
            position: absolute;
            border: 2px solid rgba(147, 112, 219, 0.15);
            border-radius: 12px;
            animation: floatShape 25s linear infinite;
        }
        .shape-1 { width: 50px; height: 50px; top: 12%; right: 18%; animation-duration: 28s; animation-delay: 0s; }
        .shape-2 { width: 35px; height: 35px; top: 65%; left: 12%; animation-duration: 22s; animation-delay: -6s; }
        .shape-3 { width: 65px; height: 65px; bottom: 12%; right: 22%; animation-duration: 32s; animation-delay: -14s; }
        .shape-4 { width: 28px; height: 28px; top: 38%; left: 8%; animation-duration: 20s; animation-delay: -4s; }
        .shape-5 { width: 45px; height: 45px; top: 22%; left: 72%; animation-duration: 24s; animation-delay: -11s; }

        @keyframes floatShape {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
            50% { transform: translateY(-25px) rotate(180deg); opacity: 0.7; }
            100% { transform: translateY(0) rotate(360deg); opacity: 0.4; }
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(147, 112, 219, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(147, 112, 219, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .login-shell {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(92vw, 470px);
        }

        .login-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 28px 28px 22px;
            border-radius: 28px;
            box-shadow: 0 20px 45px rgba(99, 102, 241, 0.16), 0 10px 20px rgba(15, 23, 42, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.75);
            animation: cardEntrance 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transform-origin: center;
        }

        .brand-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(159, 122, 234, 0.12);
            color: #5b3fb3;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: 0.72rem;
            margin-bottom: 18px;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.7);
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-header {
            margin-bottom: 26px;
            text-align: center;
            animation: fadeInUp 0.5s 0.15s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header h2 {
            color: #1f2937;
            font-size: clamp(1.9rem, 3vw, 2.3rem);
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.04em;
        }

        .login-subtitle {
            color: #64748b;
            font-size: 0.96rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
            animation: fadeInUp 0.5s both;
        }
        .form-group:nth-child(1) { animation-delay: 0.25s; }
        .form-group:nth-child(2) { animation-delay: 0.3s; }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: #475569;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 15px 16px;
            border: 1px solid rgba(148, 163, 184, 0.45);
            border-radius: 14px;
            font-size: 16px;
            background: rgba(248, 250, 252, 0.85);
            color: #0f172a;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, transform 0.2s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            outline: none;
            border-color: rgba(168, 85, 247, 0.65);
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.12);
            background: #fff;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: #fff;
            border: none;
            padding: 15px 18px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.25s ease, filter 0.2s ease;
            margin: 8px 0 18px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s 0.4s both;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(159, 122, 234, 0.35);
        }

        .login-btn:hover::before {
            transform: translateX(100%);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .register-link {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s ease, transform 0.2s ease;
            animation: fadeInUp 0.5s 0.45s both;
            display: inline-block;
        }

        .register-link:hover {
            color: #ec4899;
            transform: translateY(-1px);
        }

        .message {
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 0.92rem;
            font-weight: 600;
            animation: messageIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes messageIn {
            0% { opacity: 0; transform: translateY(-8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .error {
            background: rgba(245, 101, 101, 0.15);
            color: #c53030;
            border: 1px solid rgba(245, 101, 101, 0.3);
        }

        .success {
            background: rgba(72, 187, 120, 0.15);
            color: #276749;
            border: 1px solid rgba(72, 187, 120, 0.3);
        }

        .form-wrapper {
            animation: fadeInUp 0.5s 0.2s both;
        }
    </style>
</head>
<body>
    <div class="bg-wrapper">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="grid-overlay"></div>
    </div>

    <div class="login-shell">
        <div class="login-container">
            <div class="brand-chip"><span class="brand-dot"></span>FamEase</div>
            <div class="login-header">
                <h2>Welcome back</h2>
                <p class="login-subtitle">Sign in to keep your family budget on track.</p>
            </div>
            
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="message {% if 'successful' in message %}success{% else %}error{% endif %}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="form-wrapper">
                <form method="POST">
                    <div class="form-group">
                        <label class="input-label" for="username">Username</label>
                        <input id="username" type="text" name="username" placeholder="Enter your username" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label class="input-label" for="password">Password</label>
                        <input id="password" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="login-btn">Sign In</button>
                </form>
            </div>
            
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="register-link">Create one here</a></p>
        </div>
    </div>
</body>
</html>
